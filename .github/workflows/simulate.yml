name: Fly mission in simulator

on:
  pull_request:
    paths:
      - "**.py"

permissions:
  contents: read

jobs:
  fly:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fly the changed missions
        env:
          BASE: ${{ github.base_ref }}
        run: |
          changed=$(git diff --name-only --diff-filter=AM "origin/$BASE...HEAD")
          # any .py the PR adds outside the tooling counts as a mission (GitHub's editor can drop the folder)
          files=$(echo "$changed" | grep -E '\.py$' \
                  | grep -v -E '^(sim|lab|docs|examples|course|\.github)/' | grep -v -E '(^|/)_[^/]*\.py$' \
                  | grep -v -x -E '(fly|review_prs)\.py' || true)
          others=$(git diff --name-only "origin/$BASE...HEAD" | grep -v -x -F "$files" | grep -v -E '^(missions|training)/' || true)
          if [ -n "$others" ]; then
            echo "::warning title=Extra files::This PR changes files that aren't missions. Only your mission file should change: $(echo $others | tr '\n' ' ')"
          fi
          if [ -z "$files" ]; then
            echo "No mission files changed." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          field=jr
          if echo "$files" | grep -q '^training/'; then field=real; fi
          python fly.py --ci --field "$field" $files
